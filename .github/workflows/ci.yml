name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t trademind:ci .

      - name: Start it and check it answers
        run: |
          docker run -d --name trademind-ci -p 8000:8000 trademind:ci
          for attempt in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/health
          curl -fs http://127.0.0.1:8000/ | grep -q "<title>TradeMind</title>"

      - name: Show the logs if it failed
        if: failure()
        run: docker logs trademind-ci
