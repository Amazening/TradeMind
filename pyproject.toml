[project]
name = "trademind"
version = "0.1.0"
description = "Finds behaviour patterns in a share trading history."
readme = "README.md"
authors = [
    { name = "Mazen Khallaf", email = "41496595+Amazening@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
trademind = "trademind.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W: style, F: errors, I: import order, B: likely bugs, UP: modern syntax,
# SIM: simpler code, T20: no print(), RUF: Ruff's own rules
select = ["E", "W", "F", "I", "B", "UP", "SIM", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Scripts are command line tools, so printing is their output.
"scripts/*" = ["T201"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
